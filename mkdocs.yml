site_name: FDC3 Desktop Agent
site_description: Documentation for the FDC3 Desktop Agent Python implementation
site_author: Joel Squire
site_url: https://jnsquire.github.io/py-fdc3-desktop-agent/

docs_dir: documentation

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra_css:
  - assets/mermaid-zoom.css

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Automation: automation.md
  - Deployments: deployments.md
  - Bridging (experimental): bridging.md
  - Embedding API: embedding-api.md
  - Plugins: plugins.md
  - Data Science Integration: notebooks.md
  - External intent handlers: external-intent-handlers.md
  - Private channels: private-channels.md
  - Docker deployment: docker.md
  - System flowchart: system_flowchart.md
  - API Reference:
      - API Guide: api-guide.md
      - Desktop Agent: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            heading_level: 3
            show_root_heading: true
            members_order: source
            show_signature_annotations: true
            signature_crossrefs: true
            separate_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            show_if_no_docstring: false
            merge_init_into_class: true
            inherited_members: true
            filters:
              - "!^_"
