name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install project (dev extras)
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run linters
        run: |
          python -m pip install ruff black
          ruff check .
          black --check .

      - name: Run tests with coverage
        env:
          FDC3_DISTRIBUTED_ADAPTER: ""
          FDC3_DB_PATH: ":memory:"
        run: |
          python -m pytest --cov=fdc3_desktop_agent --cov-report=xml -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          # token is optional for public repos; set CODECOV_TOKEN in repo secrets if needed
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: fdc3-desktop-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run -d --name fdc3-test -p 8000:8000 fdc3-desktop-agent:latest
          sleep 10
          curl -f http://localhost:8000/admin || exit 1
          docker logs fdc3-test
          docker stop fdc3-test
          docker rm fdc3-test
