<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDC3 Desktop Agent - Admin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>FDC3 Desktop Agent - Admin Panel</h1>
        <p>Manage launch configurations for FDC3 applications</p>
        <nav class="nav" role="navigation" style="margin-top: 15px;">
            <a href="/public-channels">Public Channels</a>
            <a href="/channel-monitor">Channel Monitor</a>
            <a href="/app-directory">App Directory</a>
            <a href="/system-settings">System Settings</a>
            <a href="/diagnostics">Diagnostics</a>
        </nav>
        </nav>
    </div>

    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main">

    <div class="section">
        <h2>Create/Edit Launch Configuration</h2>
        <form id="launchConfigForm">
            <div class="form-group">
                <label for="appId">App ID:</label>
                <input type="text" id="appId" required>
            </div>

            <div class="form-group">
                <label for="command">Command:</label>
                <input type="text" id="command" required placeholder="e.g., python, node, ./myapp.exe">
            </div>

            <div class="form-group">
                <label for="args">Arguments (one per line):</label>
                <textarea id="args" rows="3" placeholder="arg1&#10;arg2&#10;arg3"></textarea>
            </div>

            <div class="form-group">
                <label>Environment Variables:</label>
                <div id="envVars">
                    <div class="env-var">
                        <input type="text" placeholder="KEY" class="env-key">
                        <input type="text" placeholder="VALUE" class="env-value">
                        <button type="button" onclick="removeEnvVar(this)">Remove</button>
                    </div>
                </div>
                <button type="button" onclick="addEnvVar()">Add Environment Variable</button>
            </div>

            <div class="form-group">
                <label for="cwd">Working Directory:</label>
                <input type="text" id="cwd" placeholder="Leave empty for current directory">
            </div>

            <div class="form-group">
                <label for="timeout">Timeout (seconds):</label>
                <input type="number" id="timeout" value="30" min="1" max="300">
            </div>

            <button type="submit">Save Configuration</button>
        </form>
    </div>

    <div class="section">
        <h2>Existing Launch Configurations</h2>
        <div id="launchConfigs">
            <!-- Launch configs will be loaded here -->
        </div>
    </div>

    <div class="section">
        <h2>Raise Intent (Admin)</h2>
        <div class="form-group">
            <label for="intentName">Intent Name:</label>
            <input type="text" id="intentName" placeholder="e.g., ViewChart">
        </div>
        <div class="form-group">
            <label for="intentContext">Context (JSON):</label>
            <textarea id="intentContext" rows="4" placeholder='e.g., { "id": "AAPL" }'></textarea>
        </div>
        <button type="button" onclick="raiseIntent()">Raise Intent</button>
        <div id="raiseResult" style="margin-top:10px;"></div>
    </div>

    </main>

    <div id="status" class="status" role="status" aria-live="polite" style="display: none;"></div>

    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
