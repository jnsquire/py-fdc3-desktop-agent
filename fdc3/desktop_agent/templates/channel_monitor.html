<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Monitor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>Channel Monitor</h1>
        <p>Subscribe to realtime channel events via GraphQL subscription.</p>
        <div style="margin-top:10px;">
            <nav class="nav" role="navigation"><a href="/admin">← Back to Admin</a></nav>
        </div>
    </div>

    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main">

    <div class="controls">
        <label for="channel">Channel ID (leave empty for all):</label>
        <input id="channel" placeholder="e.g. user:default" style="padding:6px; width:300px" />
        <button id="start" class="btn">Start</button>
        <button id="stop" class="btn" disabled>Stop</button>
    </div>

    <div class="events" id="events">
        <p class="meta">No events yet.</p>
    </div>

    </main>

    <div id="status" class="status" role="status" aria-live="polite"></div> 

    <script src="js/common.js"></script>
    <script src="js/channel_monitor.js"></script>
</body>
</html>
