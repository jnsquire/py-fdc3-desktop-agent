<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDC3 Desktop Agent - App Directory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>FDC3 Desktop Agent - App Directory</h1>
        <p>Manage installed FDC3 applications</p>
        <div style="margin-top:10px;">
            <a href="/admin" style="color: #3498db; text-decoration: none;">← Back to Admin</a>
        </div>
        </nav>
    </div>

    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main">

    <div class="section">
        <h2>Installed Applications</h2>
        <div class="controls">
            <input id="app-search" placeholder="Search by name or id" aria-label="Search applications" style="max-width:360px;display:inline-block;margin-right:12px" />
            <label for="app-page-size" class="meta" style="margin-left:6px;">Per page:</label>
            <select id="app-page-size" style="width:80px;display:inline-block;margin-left:6px"><option>5</option><option selected>10</option><option>25</option></select>
            <div id="app-stats" class="meta" style="display:inline-block;margin-left:12px;color:var(--muted)"></div>
        </div>
        <div id="apps-list">
            <p>Loading applications...</p>
        </div>
        <div class="pagination" style="display:flex;align-items:center;gap:8px;margin-top:8px">
            <button id="app-prev" class="btn" disabled>Prev</button>
            <span id="app-page-info" class="meta">Page 1</span>
            <button id="app-next" class="btn">Next</button>
        </div>
    </div>

    </main>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div class="section">
        <h2>Quick Actions</h2>
        <a href="/manage-apps" class="btn">Manage Apps</a>
        <a href="/admin" class="btn">Admin Panel</a>
        <a href="/system-settings" class="btn">System Settings</a>
    </div>

    <script src="js/common.js"></script>
    <script src="js/app_directory.js"></script>
</body>
</html>
