<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Channel Sequence Diagram</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Channel Sequence Diagram</h1>
    <p class="meta">Subscribe to realtime channel traffic and render a dynamic sequence diagram (Mermaid)</p>
    <nav class="nav" role="navigation"><a href="/admin">← Back to Admin</a></nav>
  </header>

  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main">

  <div class="controls">
    <label for="channel">Channel ID (leave empty for all):</label>
    <input id="channel" placeholder="e.g. user:default" />
    <button id="start" class="btn">Start</button>
    <button id="stop" class="btn" disabled>Stop</button>
    <button id="clear" class="btn">Clear</button>
  </div>

  <div class="diagram" id="diagramContainer">
    <div id="mermaidTarget"><!-- rendered svg will appear here --></div>
  </div>

  </main>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <script src="js/common.js"></script>
  <script type="module" src="js/sequence_diagram.js"></script>
</body>
</html>
