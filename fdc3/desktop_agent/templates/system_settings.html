<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDC3 Desktop Agent - System Settings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>FDC3 Desktop Agent - System Settings</h1>
        <p>Configure desktop agent behavior and security settings</p>
        <div style="margin-top:10px;">
            <nav class="nav" role="navigation"><a href="/admin">← Back to Admin</a></nav>
        </div>
    </div>

    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main">

    <div class="section">
        <h2>Security Settings</h2>
        <form id="security-form">
            <div class="form-group">
                <label for="allowed-origins">Allowed Origins (one per line):</label>
                <textarea id="allowed-origins" rows="10" placeholder="http://localhost:3000&#10;https://myapp.com&#10;*.example.com"></textarea>
            </div>
            <button type="submit" class="btn btn-success">Save Security Settings</button>
        </form>
    </div>

    <div class="section">
        <h2>System Information</h2>
        <div class="setting-item">
            <strong>Version:</strong> 0.1.0
        </div>
        <div class="setting-item">
            <strong>Status:</strong> <span id="system-status">Running</span>
        </div>
        <div class="setting-item">
            <strong>WebSocket Port:</strong> 8000
        </div>
    </div>

    <div class="section">
        <h2>Quick Actions</h2>
        <a href="/app-directory" class="btn">App Directory</a>
        <a href="/channels" class="btn">Channel Management</a>
        <a href="/diagnostics" class="btn">System Diagnostics</a>
        <a href="/admin" class="btn">Admin Panel</a>
    </div>

    <script src="js/common.js"></script>
    <script src="js/system_settings.js"></script>
</body>
</html>
