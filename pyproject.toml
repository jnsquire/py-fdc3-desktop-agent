[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit package list to ensure editable builds succeed in current Hatchling
# versions. Include both existing top-level packages so editable installs
# continue to work during the migration window.
packages = ["fdc3"]

[project]
name = "fdc3-desktop-agent"
version = "0.9.1"
description = "FDC3 Desktop Agent for Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [ { name = "Joel Squire", email = "joel@squire.org" } ]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.7",
  "strawberry-graphql>=0.250",
  "jinja2>=3.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.0",
  "ruff>=0.14",
  "datamodel-code-generator>=0.26",
  "httpx>=0.27",
  "pre-commit>=4.0"
]

# Developer tooling

# Optional dependencies for distributed adapters
etcd = [
  "etcd3>=0.12"
]

consul = [
  "aiohttp>=3.8"
]

distributed = [
  "etcd3>=0.12",
  "aiohttp>=3.8"
]

[project.scripts]
fdc3-agent = "fdc3.desktop_agent.cli:main"
install-git-hooks = "fdc3.desktop_agent.tools:install_git_hooks"
check-style = "fdc3.desktop_agent.tools:prepush"

[tool.uvx.scripts]
# run `uvx run install-git-hooks` to install the package (editable) and register hooks
install-git-hooks = "python -m pip install -e . && install-git-hooks"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
  "--strict-config",
  "--tb=short"
]
markers = [
    "asyncio: marks tests as async (using pytest-asyncio)",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
