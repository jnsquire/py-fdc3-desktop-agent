[build-system]
requires = [
  "hatchling",

  # The custom Hatch build hook (hatch_build.py) runs `mkdocs build` at build
  # time when documentation sources are present, so these must be available
  # under PEP 517 build isolation.
  "mkdocs>=1.5",
  "mkdocstrings[python]>=0.23",
  "pymdown-extensions>=10.0",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit package list to ensure editable builds succeed in current Hatchling
# versions. Include both existing top-level packages so editable installs
# continue to work during the migration window.
packages = ["fdc3"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project]
name = "fdc3-desktop-agent"
version = "0.9.6"
description = "FDC3 Desktop Agent for Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [ { name = "Joel Squire", email = "joel@squire.org" } ]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.7",
  "strawberry-graphql>=0.250",
  "jinja2>=3.0",
  "aiosqlite>=0.20",
]

# Optional dependencies for distributed adapters
[project.optional-dependencies]
etcd = [
  "etcd3>=0.12"
]

consul = [
  "aiohttp>=3.8"
]

distributed = [
  "etcd3>=0.12",
  "aiohttp>=3.8"
]

dev = [
  "pytest>=9.0.2",
  "pytest-asyncio>=1.2.8",
  "pytest-cov>=7.0",
  "ruff>=0.14",
  "datamodel-code-generator>=0.26",
  "httpx>=0.28",
  "pre-commit>=4.0",
  "mkdocs>=1.5",
  "mkdocstrings[python]>=0.23",
  "pymdown-extensions>=10.0",
]

[project.scripts]
fdc3-agent = "fdc3.desktop_agent.cli:main"
install-git-hooks = "fdc3.desktop_agent.devtools:install_git_hooks"
check-style = "fdc3.desktop_agent.devtools:prepush"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "--maxfail=1",
  "--cov=fdc3",
  "--cov-report=term-missing"
]
markers = [
    "asyncio: marks tests as async (using pytest-asyncio)",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
